name: L2C Compiler CI/CD

on:
  push:
    branches:
      - main
      - feature/*
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # 阶段一：全平台矩阵并发编译 (Matrix Build)
  # ==========================================
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
    - name:  检出代码 (Checkout)
      uses: actions/checkout@v4

    - name:  安装极简底层依赖 (Linux 分支)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # 极客减负：再也不需要 luarocks, tl, inspect 和 nelua！只要基础环境！
        sudo apt-get install -y lua5.4 clang gcc make
        sudo ln -sf /usr/bin/lua5.4 /usr/bin/lua

    - name:  安装极简底层依赖 (macOS 分支)
      if: runner.os == 'macOS'
      run: |
        brew update
        # 极客减负：Mac 端也仅需一个最纯净的 Lua 解释器！
        brew install lua

    - name:  锻造独立二进制本体 (Build)
      run: |
        echo " 执行盗梦空间元编译..."
        lua build_native_l2c.lua
        # 此时生成了 l2c_bin，千万不要在这里重命名，否则接下来的测试找不到它！

    - name:  执行 TDD 护城河测试 (Test)
      run: |
        echo " 启动 L2C 全自动测试总线..."
        # 此时它会完美调用刚刚生成的 ./l2c_bin 进行测试！
        lua test_runner.lua

    - name:  重命名并归档产物 (Archive)
      run: |
        # 测试通过后，重命名以防 GitHub Artifacts 名字冲突
        mv l2c_bin l2c_bin_${{ runner.os }}_${{ runner.arch }}

    - name:  临时存储 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: l2c-compiler-${{ runner.os }}-${{ runner.arch }}
        path: l2c_bin_${{ runner.os }}_${{ runner.arch }}
        retention-days: 1

  # ==========================================
  # 阶段二：终极自动发版 (Release)
  # ==========================================
  release:
    name:  自动推送到 GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name:  下载所有平台的编译产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name:  创建 Release 页面并挂载二进制武器
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/l2c_bin_*
        generate_release_notes: true